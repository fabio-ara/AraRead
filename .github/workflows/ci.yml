name: verificação local
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run check && npm run docs:check && npm run audit:public && npm run build
      - run: npx tsx scripts/prepare-edge.ts && npx tsx scripts/verify-edge-package.ts
      - run: docker build -t araread:ci .
      - run: npm run local:setup
      - run: docker compose up -d --wait
      - run: npm run db:migrate && npm run local:accounts
      - name: Conversão real DOC e MOBI em contêiner isolado
        run: |
          docker build -f Dockerfile.convert -t araread-convert:1 .
          npx tsx scripts/verify-legacy-conversion.ts
      - name: OCR aberto local com recursos limitados
        run: |
          docker build -f Dockerfile.ocr -t araread-ocr:ci .
          mkdir -p .local/ocr
          chmod 777 .local/ocr
          docker run --rm --network none --memory 512m --cpus 1 --pids-limit 64 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m -v "$PWD/tests/fixtures:/input:ro" -v "$PWD/.local/ocr:/output" araread-ocr:ci /input/synthetic-scanned.pdf /output/scanned-import.json --language eng
          node --import tsx --env-file-if-exists=.env scripts/verify-ingestion-v3.ts .local/ocr/scanned-import.json
      - name: servidor e testes reais
        run: |
          NODE_ENV=production npm run dev > /tmp/araread-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4317/health && break; sleep 1; done
          npm test
      - name: Medição de conteúdo compartilhado e tráfego sintético
        run: node --import tsx --env-file-if-exists=.env scripts/benchmark-editions.ts
      - name: Chromium e WebKit na imagem oficial fixada
        run: |
          docker pull "$PLAYWRIGHT_IMAGE"
          for browser in chromium webkit; do
            # As suítes compartilham o endereço local. Respeita a janela real
            # do limitador HTTP, sem relaxar a proteção para executar testes.
            sleep 60
            docker run --rm --init --network host --ipc=host -e CI=1 -e PLAYWRIGHT_BROWSER="$browser" -v "$PWD:/work" -w /work "$PLAYWRIGHT_IMAGE" npm run test:e2e
          done
      - run: npm audit --audit-level=moderate
      - name: Evidências sintéticas da revisão
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: edition-evidence-${{ github.sha }}
          path: |
            .local/evidence/editions*.png
            .local/evidence/edition-widget*.png
            .local/evidence/editions-storage.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - if: always()
        run: docker compose down
